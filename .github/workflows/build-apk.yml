name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Cannot detect Java version"
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version is less than 17 ($JAVA_MAJOR)"
            exit 1
          fi
          echo "Java version verified: $JAVA_MAJOR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f ./debug.keystore ]; then
              echo "Error: Failed to create debug.keystore"
              exit 1
            fi
            echo "Successfully created temporary debug.keystore."
          else
            echo "debug.keystore already exists."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Contents of app/build/outputs/apk:"
            find app/build/outputs/apk -type f || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "Error: File is not an .apk"
            exit 1
          fi
          echo "APK successfully verified at $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | sed -e 's/[^A-Za-z0-9._-]/_/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "asset_filename=$ASSET_FILENAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is missing or empty."
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Release asset is not an .apk file."
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes "This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          Run number: ${{ github.run_number }}
          Run attempt: ${{ github.run_attempt }}
          Source commit: ${{ github.sha }}
          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ steps.release.outputs.release_tag }}"
          if [ "${{ steps.release.outcome }}" == "success" ]; then
            echo "### ✅ APK Build and Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "The APK was successfully built and published." >> $GITHUB_STEP_SUMMARY
            
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            
            echo "**Release Tag:** $RELEASE_TAG" >> $GITHUB_STEP_SUMMARY
            echo "**Release Title:** Debug APK Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "**Release URL:** $RELEASE_URL" >> $GITHUB_STEP_SUMMARY
            echo "**APK Asset:** ${{ steps.prepare_asset.outputs.asset_filename }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "You can download the APK from the release Assets section at the URL above." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup on the workflow run page." >> $GITHUB_STEP_SUMMARY
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: ${{ steps.prepare_asset.outputs.asset_filename }}"
          else
            echo "### ⚠️ APK Built Successfully, but Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "The APK was successfully built, but publishing the GitHub Release failed." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact named \`app-debug-apk\` remains available as a backup on the workflow run page." >> $GITHUB_STEP_SUMMARY
            
            echo "Warning: Release publishing failed."
            echo "The APK build succeeded."
            echo "The Actions artifact named app-debug-apk remains available."
          fi
